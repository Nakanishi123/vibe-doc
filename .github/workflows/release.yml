name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vibe-doc") | .version')
          tag_version=${GITHUB_REF_NAME#v}
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match Cargo version $package_version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: validation

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: vibe-doc-linux-x86_64
            executable: vibe-doc
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: vibe-doc-windows-x86_64
            executable: vibe-doc.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: vibe-doc-macos-x86_64
            executable: vibe-doc
          - os: macos-15
            target: aarch64-apple-darwin
            archive: vibe-doc-macos-aarch64
            executable: vibe-doc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --package vibe-doc --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.archive }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.archive }}/"
          cp README.md LICENSE "dist/${{ matrix.archive }}/"
          tar -C dist -czf "dist/${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/${{ matrix.archive }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.archive }}/"
          Copy-Item README.md, LICENSE "dist/${{ matrix.archive }}/"
          Compress-Archive -Path "dist/${{ matrix.archive }}" -DestinationPath "dist/${{ matrix.archive }}.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download packaged binaries
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
